[app]
name = "paperless-ngx"
version = "0.1.0"
description = "Paperless-ngx document management with OCR (single-container, SQLite + bundled Redis)"

[runtime.container]
image = "Dockerfile"
port = 8000

[routing]
health_check = "/accounts/login/"
# Paperless has its own user system (not header-friendly for SSO), so we
# expose every path publicly and let Paperless's own login form handle
# authentication. The owner can log in with the admin credentials written
# to $OPENHOST_APP_DATA_DIR/admin-password.txt on first boot.
public_paths = ["/"]

[resources]
# Paperless is heavy: it bundles a webserver, two celery workers, a
# scheduler, a consume watcher, plus Redis. OCR (tesseract) is CPU-bound
# and will use the whole core during ingestion. 1 GiB / 1 core gives the
# whole stack room to breathe with light document loads; bump if you
# regularly ingest large multi-page PDFs.
memory_mb = 1024
cpu_millicores = 1000

[data]
# All Paperless state — SQLite DB, search index, original PDFs,
# thumbnails, export staging, consume drop-zone, and the generated
# admin-password.txt — lives under $OPENHOST_APP_DATA_DIR.
app_data = true
